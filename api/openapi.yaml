openapi: 3.0.3
info:
  title: Gin Template API
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200": { description: Ready }
        "503": { description: Unavailable }
  /api/v1/users:
    get:
      summary: List users
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: OK }
    post:
      summary: Create user
      responses:
        "201": { description: Created }
        "409": { description: Email already in use }
  /api/v1/users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      summary: Get user
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      summary: Update user
      responses:
        "200": { description: OK }
    delete:
      summary: Delete user
      responses:
        "204": { description: Deleted }
